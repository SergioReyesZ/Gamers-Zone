<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/login.css">   
        <link rel="icon" type="image/png" href="iconos/logo.avif">
        <title>Gamer's Zone - Iniciar Sesión</title> 
    </head>
    <body class="documento">
            <div class="login">
                <div class="-titulo-back">
                    <button class="boton"><a href="javascript:history.back()"><i class="bi bi-arrow-left"></i></a></button>
                    <p class="titulo">Inicio de sesión</p>
                    <button class="boton oculto"></button>
                </div>
                <form action="" id="login-form" novalidate>
                    <p class="subtitulo">Correo</p>
                    <input placeholder="Usuario" id="email" type="email" required>
                    <p class="subtitulo">Contraseña</p>
                    <input placeholder="Contraseña" type="password" id="password" required>
                    <p class="subtitulo mensaje" id="mensaje"></p>
                    <button type="submit" class="iniciar">Iniciar sesión</button>
                    
                </form>
                <div class="-subtitulo-link">
                    
                    <p class="subtitulo-link">No tienes cuenta? <a href="registro.html">Registrate aquí</a></p>
                    <p class="subtitulo-link">Olvidaste tu contraseña? <a href="forgot.html">Click aquí</a></p>
                </div>
                
                
            </div>
            
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="scripts/supabase.js"></script>
        <script src="scripts/app.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/agregar_producto.css">       
        <title>Gamer's Zone - Agregar producto</title> 
        <link rel="icon" type="image/png" href="iconos/logo.avif">
    </head>
    <body>
        <div id="navbar-placeholder"></div>
        <div class="contenedor-principal">
            <div class="-titulo-back">
                <button class="boton"><a href="javascript:history.back()"><i class="bi bi-arrow-left"></i></a></button>
                <h1>Agregar producto</h1>
            </div>
            <div class="fotos">
                <div class="foto"></div>
                <div class="foto"></div>
                <div class="foto"></div>
                <div class="foto"></div>
                <div class="foto"></div>
                <div class="agregar-foto">
                    <div class="agregar-foto icono">
                        <i class="bi bi-plus-square"></i>
                    </div>
                    <p>Agregar fotos</p>
                </div>
            </div>
            <div class="informacion-producto">
                <form action="">
                    <p class="subtitulo">Título</p>
                    <input type="text" placeholder="Nombre del producto" class="input">
                    <p class="subtitulo">Precio</p>
                    <input type="number" placeholder="Precio" class="input">
                    <p class="subtitulo">Categoría</p>
                    <select name="Categoría" id="" class="select">
                        <option value="" selected disabled>Categoría</option>
                        <option value="">Consolas</option>
                        <option value="">Juegos</option>
                        <option value="">Accesorios</option>
                        <option value="">Figuras</option>
                        <option value="">Juguetes</option>
                        <option value="">Cartas</option>
                        <option value="">Otro</option>
                    </select>
                    <p class="subtitulo">Estado</p>
                    <select name="Estado" id="" class="select">
                        <option value="" selected disabled>Estado</option>
                        <option value="">Nuevo</option>
                        <option value="">Usado</option>
                        <option value="">Seminuevo</option>
                    </select>
                    <p class="subtitulo">Descripción</p>
                    <textarea name="" id="" placeholder="Descripción (opcional)" class="descripcion"></textarea>
                    <div class="marca-stock-codigo">
                        <select name="Marca" id="marcaFiguras" class="select marca">
                        <option value="" selected disabled>Marca</option>
                        <option value="">Figuarts</option>
                        <option value="">DragonStars</option>
                        <option value="">Funko</option>
                        <option value="">Lego</option>
                        </select>
                        <input type="number" placeholder="1" class="input stock" min="1">
                        
                    </div>
                    
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="scripts/supabase.js"></script>
        <script src="scripts/auth.js"></script>
        <script src="scripts/agregar_producto.js"></script>
    </body>
</html>

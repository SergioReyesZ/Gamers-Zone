<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="viewport" content="width=device-width, height=device-height,  initial-scale=1.0, user-scalable=no, user-scalable=0"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/cuenta.css">       
        <title>Gamer's Zone - Contactos</title> 
        <link rel="icon" type="image/png" href="iconos/logo.avif">
    </head>
    <body>
        
        <div id="navbar-placeholder"></div>

        <div class="contenedor-principal" id="contenedor-principal">
            <div class="contenedor-izquierdo">
                <div class="-titulo-back">
                <button class="boton"><a href="javascript:history.back()"><i class="bi bi-arrow-left"></i></a></button>
                <h1>Cuenta</h1>
                </div>
                <div class="foto">
                    <img alt="Imagen" width="150" id="foto">
                    <div class="editar">
                        <i class="bi bi-pencil-square"></i>
                        <p>Foto de perfil</p>
                    </div>
                </div>
            </div>
            <hr class="l-vertical">
            <div class="info">
                <h2>Datos</h2>
                
                <div class="datos">
                    <p>
                    <span><strong>Inicial:</strong></span>
                    <span id="inicial">{Inicial usuario}</span>
                </p>
                    <p>
                    <span><strong>Nombre:</strong></span>
                    <span id="nombre">{nombre usuario}</span>
                </p>
                <p>
                    <span><strong>Usuario: </strong></span>
                    <span id="usuario">{usuario}</span>
                </p>
                <p>
                    <span><strong>Tipo: </strong></span>
                <span id="tipo">{tipo usuario}</span>
                </p>
                <p>
                    <span><strong>Correo: </strong></span>
                <span id="correo">{correo del usuario}</span>
                </p>
                <p>
                    <span><strong>Teléfono: </strong></span>
                    <span id="telefono">{teléfono del usuario}</span>
                </p>
                </div>
                <hr class="l-horizontal">
                <h2>Información personal</h2>
                
                <div class="datos">
                    <p>
                    <span><strong>Sexo:</strong></span>
                    <span id="genero">{Sexo usuario}</span>
                </p>
                
                </div>
                <div class="editar" id="editar">
                        <p>Editar información</p>
                        
                        <i class="bi bi-pencil-square"></i>
                    </div>
            </div>
        </div>
        <div class="contenedor-principal editar-info">
            <div class="-titulo-back">
                <button class="boton" id="volver"><i class="bi bi-arrow-left"></i></button>
                <h1>Cuenta</h1>
            </div>
            <form action="">
                <p>Correo</p>
                <div class="input-icono">
                    <input type="email" name="" placeholder="Correo" id="formCorreo">
                    <i class="bi bi-envelope"></i>
                </div>
                
                <p>Teléfono</p>
                <div class="input-icono">
                    <input type="tel" name="" placeholder="Teléfono" id="formTelefono">
                    <i class="bi bi-telephone"></i>
                </div>
                
                <p>Foto</p>
                <div class="input-foto" id="divInputFoto">
                    <p>Escoger foto</p>
                    <input type="file" name="" id="inputFoto">
                </div>
                
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="scripts/supabase.js"></script>
        <script src="scripts/auth.js"></script>
        <script src="scripts/cuenta.js"></script>
    </body>
</html>
